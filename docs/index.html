<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuillGrid Notebook</title>
  <style>
    :root {
      color: #242016;
      background: #fbf6ea;
      font-family: Georgia, "Times New Roman", serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }
    main {
      max-width: 760px;
      width: 100%;
      background: #fffdf7;
      border: 1px solid #e4d8bd;
      border-radius: 8px;
      padding: 36px;
      box-shadow: 0 16px 45px rgba(82, 61, 24, 0.12);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 36px;
      line-height: 1.1;
    }
    p {
      font-size: 18px;
      line-height: 1.6;
    }
    a {
      color: #1d62a7;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>QuillGrid Notebook</h1>
    <p>A cozy letter-grid puzzle game for turning your own writing into playable notebook levels.</p>
    <p><a href="privacy-policy.html">Privacy Policy</a></p>
  </main>
</body>
</html>
